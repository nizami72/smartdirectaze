# Login attempts: 5 per minute per IP (a burst of 5 at once, then one every 12 s), so a password
# cannot be guessed by trying many. Registrations: 30 per minute per IP (an e2e run makes ~16 in 20 s).
# Both answer 429 when exceeded.
# (This file is included inside http {} of nginx.conf, where limit_req_zone belongs.)
limit_req_zone $binary_remote_addr zone=smartdirect_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=smartdirect_register:10m rate=30r/m;

server {
    listen 80;
    server_name smartdirect.qrfood.az;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name smartdirect.qrfood.az;

    ssl_certificate     /etc/letsencrypt/live/smartdirect.qrfood.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartdirect.qrfood.az/privkey.pem;

    # Product photos
    client_max_body_size 10m;

    # Frontend (React build)
    root /var/www/smartdirect.qrfood.az/dist;

    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The AI test chat waits for the model
        proxy_read_timeout 120s;
    }

    location = /api/v1/auth/login {
        limit_req zone=smartdirect_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/register {
        limit_req zone=smartdirect_register burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy Telegram bot / Instagram webhooks: not used by the WhatsApp pilot, closed
    # (exact match for Instagram: a prefix would also close /webhooks/inventory)
    location ^~ /webhooks/t/ { return 404; }
    location = /webhooks/i { return 404; }

    # Green API webhooks and the embedded inventory (forms, photos)
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }

    # SPA: every other path is a React route
    location / {
        try_files $uri /index.html;
    }
}
