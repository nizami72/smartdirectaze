server {
    listen 80;
    server_name smartdirect.qrfood.az;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name smartdirect.qrfood.az;

    ssl_certificate     /etc/letsencrypt/live/smartdirect.qrfood.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartdirect.qrfood.az/privkey.pem;

    # Product photos
    client_max_body_size 10m;

    # Frontend (React build)
    root /var/www/smartdirect.qrfood.az/dist;

    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The AI test chat waits for the model
        proxy_read_timeout 120s;
    }

    # Green API / Telegram webhooks and the embedded inventory (forms, photos)
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }

    # SPA: every other path is a React route
    location / {
        try_files $uri /index.html;
    }
}
